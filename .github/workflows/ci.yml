name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests & Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Go Unit Tests
        run: go test -v ./internal/bpf ./services
      - name: Frontend Dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: QRS Smoke Test
        working-directory: frontend
        run: bun run qrs:smoke
      - name: Frontend Typecheck & Build
        working-directory: frontend
        run: bun run build

  build:
    name: Build ${{ matrix.target }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            os: windows-latest
            arch: amd64
          - target: windows-arm64
            os: windows-latest
            arch: arm64
          - target: macos-amd64
            os: macos-13
            arch: amd64
          - target: macos-arm64
            os: macos-14
            arch: arm64
          - target: linux-amd64
            os: ubuntu-24.04
            arch: amd64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install Linux build dependencies
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - name: Build Desktop Application
        run: wails3 build ARCH=${{ matrix.arch }}
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-share-${{ matrix.target }}
          path: bin/
          if-no-files-found: error
